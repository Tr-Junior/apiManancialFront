<p-divider>Escolha o Tipo de Upload</p-divider>
<div class="card p-4">
  <div class="flex gap-4 mb-3 field">
    <div class="flex align-items-center gap-2">
      <p-radioButton name="uploadType" value="logo" label="Logo" [(ngModel)]="uploadType"
        [disabled]="false"></p-radioButton>
      <div *ngIf="logoImage">
        <img [src]="logoImage.filePath" alt="Logo" class="uploaded-image" shape="circle"
          style="width: 30px; border-radius: 25px" />
      </div>
    </div>
    <div class="flex align-items-center gap-2">
      <p-radioButton name="uploadType" value="pdf" label="PDF" [(ngModel)]="uploadType"
        [disabled]="false"></p-radioButton>
      <div *ngIf="pdfImage">
        <img [src]="pdfImage.filePath" alt="PDF" class="uploaded-image" style="width: 30px; border-radius: 25px" />
      </div>
    </div>

  </div>
  <p-fileUpload name="file" accept="image/*, application/pdf" maxFileSize="1000000"
    (onUpload)="onTemplatedUpload($event)" (onSelect)="onSelectedFiles($event)">
    <ng-template pTemplate="header" let-files let-chooseCallback="chooseCallback" let-clearCallback="clearCallback"
      let-uploadCallback="uploadCallback">
      <div class="flex flex-wrap justify-content-between align-items-center flex-1 gap-2">
        <div class="flex gap-2">
          <p-button (onClick)="choose($event, chooseCallback)" icon="pi pi-images" [rounded]="true" [outlined]="true"
            label="Escolher" />
          <p-button (onClick)="onTemplatedUpload($event, clearCallback)" icon="pi pi-cloud-upload" [rounded]="true"
            [outlined]="true" severity="success" [disabled]="!files || files.length === 0" label="Enviar" />
          <p-button (onClick)="clearCallback()" icon="pi pi-times" [rounded]="true" [outlined]="true" severity="danger"
            [disabled]="!files || files.length === 0" label="Limpar" />
        </div>
        <p-progressBar [value]="totalSizePercent" [showValue]="false" styleClass="md:w-20rem h-1rem w-full md:ml-auto"
          [ngClass]="{ 'exceeded-progress-bar': totalSizePercent > 100 }">
          <span class="white-space-nowrap">{{ totalSize }}B / 1Mb</span>
        </p-progressBar>
      </div>
    </ng-template>
    <ng-template pTemplate="empty">
      <div class="flex align-items-center justify-content-center flex-column">
        <i class="pi pi-cloud-upload border-2 border-circle p-5 text-4xl text-400 border-400"></i>
        <p class="mt-4 mb-0">Arraste e solte os arquivos para upload.</p>
      </div>
    </ng-template>
  </p-fileUpload>

</div>
<p-toast></p-toast>
